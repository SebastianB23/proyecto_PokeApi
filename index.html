<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <title>Proyecto Final JS</title>
</head>
<body>
  
  <!-- Navbar -->
  <header>
    <nav class="navbar">
        <ul>
            <li><a href="#" id="search-link">Buscar Pokémon</a></li>
            <li><a href="#" id="list-link">Ver Todos los Pokémon</a></li>
            <li><a href="#" id="most-searched-link">Más buscados</a></li>
        </ul>
    </nav>
</header>

  <!-- Sección de búsqueda (oculta al cargar la página) -->
  <div class="container" id="search-section" style="display:none;">
    <div class="search-space">
        <i class="fa-sharp fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Nombre del Pokémon" value="">
    </div>
    <div class="info-box">
        <div class="color-box">
            <div class="pokemon-id"></div>
        </div>
        <img src="" alt="">
        <h3 class="pokemon-name"></h3>
        <div class="pokemon-types"></div>
        <div class="pokemon-stats"></div>
    </div>
    <div class="navigation-buttons">
        <button id="prev-pokemon">Anterior</button>
        <button id="next-pokemon">Siguiente</button>
    </div>
</div>

 <!-- Sección de todos los Pokémon -->
  <div id="list-section" style="display: none;">
      <div id="loading-message" style="display: none;">Cargando Pokémon...</div>
      <div class="pokemon-grid"></div> <!-- Contenedor de Pokémon -->
      <div id="page-info"></div>
      <button id="prev-page">Anterior</button>
      <button id="next-page">Siguiente</button>
  </div>

  <section id="most-searched-section" style="display: none;">
    <h3>Pokémon más buscados:</h3>
    <div id="most-searched-pokemon" class="pokemon-grid"></div> <!-- Grid de Pokémon más buscados -->
</section>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="./main.js"></script>
</body>
</html>
